<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Flight</title>
<!-- MapLibre GL v5 bundles its web worker inline, so the map renders even when
     this file is opened straight from disk (file://). CesiumJS, used before,
     can't start its globe workers from a file:// page and only shows space. -->
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body, #map {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #02060b;
  }
  [hidden] { display: none !important; }

  /* ---------- Startup overlay ---------- */
  #startup {
    position: absolute; inset: 0; z-index: 50;
    background: radial-gradient(ellipse at center, #0a1a2a 0%, #02060b 100%);
    color: #d7e6f2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 0 16px;
  }
  #startup h1 {
    font-size: 34px; font-weight: 700; letter-spacing: 2px; margin: 0;
    color: #7CFC9A; text-shadow: 0 0 18px rgba(124,252,154,.35);
  }
  #startup p { margin: 0; opacity: .75; font-size: 14px; }
  #startup .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 620px; }
  #startup input {
    background: #0d2233; border: 1px solid #1d4a66;
    color: #e6f2fb; padding: 12px 16px; border-radius: 8px; font-size: 15px;
    width: 320px; max-width: 100%; outline: none;
  }
  #startup input:focus { border-color: #7CFC9A; }
  .preset {
    background: #0d2233; border: 1px solid #1d4a66; color: #bcd6e8;
    padding: 9px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .preset:hover { background: #14354d; border-color: #7CFC9A; color: #fff; }
  #goBtn {
    background: #7CFC9A; color: #042713; border: none; padding: 13px 40px;
    border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; transition: transform .1s;
  }
  #goBtn:hover { transform: scale(1.04); }
  #goBtn:disabled { opacity: .4; cursor: wait; transform: none; }
  #loadStatus { font-size: 13px; min-height: 18px; color: #7CFC9A; opacity: .85; text-align: center; }

  /* ---------- HUD ---------- */
  #minimap {
    position: absolute; top: 14px; left: 14px; z-index: 20;
    width: 190px; height: 190px; border-radius: 50%;
    border: 2px solid rgba(124,252,154,.5);
    background: rgba(3,12,20,.72); box-shadow: 0 0 22px rgba(0,0,0,.6);
  }
  #minimapLabel {
    position: absolute; top: 210px; left: 14px; z-index: 20; width: 194px;
    text-align: center; color: #7CFC9A; font-size: 11px; letter-spacing: 1px;
    opacity: .8; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  #speedPanel {
    position: absolute; top: 64px; right: 18px; z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; background: rgba(3,12,20,.72); padding: 16px 12px;
    border-radius: 14px; border: 1px solid rgba(124,252,154,.25);
  }
  #speedVal { color: #7CFC9A; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* A rotated horizontal slider: vertical range inputs aren't supported by
     every Safari version, a transform is. */
  .sliderWrap { position: relative; width: 28px; height: 240px; }
  #speedSlider {
    -webkit-appearance: none; appearance: none; background: transparent;
    position: absolute; left: 50%; top: 50%; margin: 0;
    width: 240px; height: 28px;
    transform: translate(-50%, -50%) rotate(-90deg);
    outline: none; cursor: pointer;
  }
  #speedSlider::-webkit-slider-runnable-track { height: 8px; background: #12303f; border-radius: 6px; }
  #speedSlider::-moz-range-track { height: 8px; background: #12303f; border-radius: 6px; }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%;
    background: #7CFC9A; box-shadow: 0 0 8px rgba(124,252,154,.7);
  }
  #speedSlider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%; border: none;
    background: #7CFC9A; box-shadow: 0 0 8px rgba(124,252,154,.7);
  }
  .speedCap { color: #6f8ea3; font-size: 10px; letter-spacing: 1px; }

  #nowPlaying {
    position: absolute; bottom: 16px; right: 16px; z-index: 20;
    width: 300px; max-width: calc(100% - 32px); box-sizing: border-box;
    background: rgba(3,12,20,.82);
    border: 1px solid rgba(124,252,154,.35); border-radius: 12px;
    padding: 14px 16px; color: #d7e6f2;
    box-shadow: 0 0 26px rgba(0,0,0,.55);
    transform: translateY(140%); opacity: 0;
    transition: transform .5s cubic-bezier(.2,.8,.25,1), opacity .5s;
  }
  #nowPlaying.show { transform: translateY(0); opacity: 1; }
  #npTitle {
    color: #7CFC9A; font-size: 16px; font-weight: 700; margin-bottom: 4px;
    text-shadow: 0 0 10px rgba(124,252,154,.3);
    display: flex; align-items: center; gap: 8px;
  }
  #npName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #npTitle .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #7CFC9A;
    box-shadow: 0 0 8px #7CFC9A; animation: pulse 1.6s infinite; flex: none;
  }
  #npTitle.dead { color: #ffb3b3; }
  #npTitle.dead .dot { background: #ff5c5c; box-shadow: 0 0 8px #ff5c5c; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  #npMeta { font-size: 12px; line-height: 1.5; opacity: .85; }
  #npMeta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #npMeta .k { color: #6f8ea3; }
  #npStatus { font-size: 11px; margin-top: 6px; color: #6f8ea3; font-style: italic; min-height: 14px; }
  #nowPlaying.isDead #npStatus { color: #ffb3b3; }

  .npButtons { display: flex; gap: 8px; margin-top: 10px; }
  .npButtons button {
    flex: 1; border-radius: 8px; padding: 7px 10px; font-size: 12px;
    font-weight: 700; letter-spacing: .3px; cursor: pointer; transition: background .15s;
  }
  #muteBtn { flex: 0 0 auto; background: #0d2233; border: 1px solid rgba(124,252,154,.35); color: #7CFC9A; }
  #muteBtn:hover { background: #14354d; }
  #skipBtn { background: #2a0e0e; border: 1px solid #ff5c5c; color: #ffb3b3; }
  #skipBtn:hover { background: #3a1414; }

  #hudHelp {
    position: absolute; bottom: 16px; left: 16px; z-index: 20;
    color: #88a4b8; font-size: 11px; line-height: 1.6;
    background: rgba(3,12,20,.72); padding: 8px 12px; border-radius: 8px;
    letter-spacing: .3px;
  }
  #hudHelp b { color: #7CFC9A; }
  #altReadout {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 20; color: #7CFC9A; font-size: 12px; letter-spacing: 1px;
    background: rgba(3,12,20,.72); padding: 6px 14px; border-radius: 18px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .maplibregl-ctrl-attrib { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>

<!-- Startup -->
<div id="startup">
  <h1>RADIO FLIGHT</h1>
  <p>Fly the world. Listen to whatever's closest.</p>
  <div class="row">
    <input id="locInput" type="text" placeholder="Type a place (e.g. Tokyo, Paris, Cairo) and press Enter" />
  </div>
  <div class="row" id="presets"></div>
  <button id="goBtn" disabled>Loading stations…</button>
  <div id="loadStatus">Fetching global station list…</div>
</div>

<!-- HUD -->
<canvas id="minimap" width="190" height="190"></canvas>
<div id="minimapLabel">~120 km radius</div>
<div id="altReadout">ALT 200 m</div>

<div id="speedPanel">
  <div id="speedVal">500</div>
  <div class="speedCap">KM/H</div>
  <div class="sliderWrap">
    <input id="speedSlider" type="range" min="0" max="5000" value="500" step="10" aria-label="Speed in km/h" />
  </div>
  <div class="speedCap">0 = HOVER</div>
</div>

<div id="nowPlaying">
  <div id="npTitle"><span class="dot"></span><span id="npName">—</span></div>
  <div id="npMeta">
    <div><span class="k">Location:</span> <span id="npLoc"></span></div>
    <div><span class="k">Genre:</span> <span id="npGenre"></span></div>
    <div><span class="k">Stream:</span> <span id="npStream"></span></div>
    <div><span class="k">Distance:</span> <span id="npDist"></span></div>
  </div>
  <div id="npStatus"></div>
  <div class="npButtons">
    <button id="muteBtn">🔊 Mute</button>
    <button id="skipBtn" hidden>⏭ Skip dead station</button>
  </div>
</div>

<div id="hudHelp">
  <b>W</b>/<b>S</b> or <b>↑</b>/<b>↓</b> climb / descend &nbsp; <b>A</b>/<b>D</b> or <b>←</b>/<b>→</b> turn<br>
  Slider sets forward speed &middot; <b>0</b> to hover
</div>

<audio id="player" preload="none"></audio>

<script>
"use strict";
// ====================================================================
//  RADIO FLIGHT — single-user flight sim over a radio-station map
// ====================================================================

const RADIO_SERVERS = [
  "https://de1.api.radio-browser.info",
  "https://de2.api.radio-browser.info",
  "https://fi1.api.radio-browser.info",
  "https://all.api.radio-browser.info",
];
// Esri World Imagery: key-free, CORS-enabled, and (unlike OSM's tile servers)
// doesn't reject requests from file:// pages that send no Referer.
const IMAGERY_URL =
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

const CAMERA_PITCH = 78;              // degrees from straight down, i.e. 12° below the horizon
const MIN_ALT = 20, MAX_ALT = 12000;  // metres
const TURN_RATE = 0.6;                // rad/s
const MM_RADIUS_KM = 120;             // half-extent shown on the minimap
const PROXIMITY_MS = 1000;            // how often to look for a closer station
const STREAM_START_TIMEOUT_MS = 12000;

const PRESETS = [
  { name: "Tokyo",       lat: 35.68,  lon: 139.69 },
  { name: "Paris",       lat: 48.86,  lon: 2.35 },
  { name: "New York",    lat: 40.71,  lon: -74.0 },
  { name: "London",      lat: 51.51,  lon: -0.13 },
  { name: "Mexico City", lat: 19.43,  lon: -99.13 },
  { name: "Cairo",       lat: 30.04,  lon: 31.24 },
  { name: "São Paulo",   lat: -23.55, lon: -46.63 },
  { name: "Mumbai",      lat: 19.08,  lon: 72.88 },
];

let stations = [];          // geo-tagged stations, s.id === index
let map = null;
let mapReady = false;
let flying = false;
let pendingStart = null;    // a start requested before the station list arrived

const state = {
  lon: 0, lat: 0,           // degrees
  altitude: 200,            // metres
  heading: 0,               // radians, 0 = north, clockwise
  speedKph: 500,
  climb: 0,                 // +1 climbing, -1 descending
  turn: 0,                  // -1 left, +1 right
};

let currentStation = null;
const deadStationUrls = new Set();   // streams that failed this session

const $ = (id) => document.getElementById(id);
const toRad = (d) => d * Math.PI / 180;
const toDeg = (r) => r * 180 / Math.PI;
const wrapLon = (lon) => ((lon + 540) % 360) - 180;

// ====================================================================
//  STATION LOADING
// ====================================================================
async function fetchStationList() {
  let lastErr;
  for (const server of RADIO_SERVERS) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    try {
      const res = await fetch(server +
        "/json/stations/search?has_geo_info=true&hidebroken=true" +
        "&order=clickcount&reverse=true&limit=40000", { signal: ctrl.signal });
      clearTimeout(timer);  // only time out the connection, not the big download
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
      console.warn("Station server failed:", server, e);
    }
  }
  throw lastErr;
}

async function loadStations() {
  const status = $("loadStatus");
  try {
    const data = await fetchStationList();
    const seenUrls = new Set();
    stations = [];
    for (const s of data) {
      const lat = Number(s.geo_lat), lon = Number(s.geo_long);
      if (s.geo_lat == null || s.geo_long == null || !isFinite(lat) || !isFinite(lon)) continue;
      if (Math.abs(lat) > 90 || Math.abs(lon) > 180 || (lat === 0 && lon === 0)) continue;
      if (!s.url_resolved || seenUrls.has(s.url_resolved)) continue;
      seenUrls.add(s.url_resolved);
      stations.push({
        id: stations.length,
        name: (s.name || "").trim() || "Unknown station",
        lat, lon,
        url: s.url_resolved,
        country: s.country || "",
        state: s.state || "",
        tags: s.tags || "",
        codec: s.codec || "",
        bitrate: s.bitrate || 0,
      });
    }
    indexStations();
    status.textContent = stations.length.toLocaleString() + " geo-located stations loaded.";
    const btn = $("goBtn");
    btn.disabled = false;
    btn.textContent = "Start flying ▸";
    if (pendingStart) startFlight(pendingStart.lat, pendingStart.lon);
  } catch (e) {
    status.textContent = "Couldn't load stations. Check your connection and reload.";
    console.error(e);
  }
}

// ====================================================================
//  GEO HELPERS + SPATIAL INDEX
// ====================================================================
function haversineKm(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// 1°×1° buckets so per-frame lookups don't scan every station.
const grid = new Map();
const cellKey = (latI, lonI) => latI * 360 + ((lonI % 360) + 360) % 360;

function indexStations() {
  grid.clear();
  for (const s of stations) {
    const key = cellKey(Math.min(179, Math.floor(s.lat + 90)), Math.floor(s.lon + 180));
    let bucket = grid.get(key);
    if (!bucket) grid.set(key, bucket = []);
    bucket.push(s);
  }
}

function stationsWithin(radiusKm) {
  const out = [];
  const dLat = radiusKm / 111;
  const latLo = Math.max(0, Math.floor(state.lat - dLat + 90));
  const latHi = Math.min(179, Math.floor(state.lat + dLat + 90));
  const edgeLat = Math.min(89.9, Math.abs(state.lat) + dLat);
  const dLon = radiusKm / (111 * Math.cos(toRad(edgeLat)));
  let lonLo = Math.floor(state.lon - dLon + 180);
  let lonHi = Math.floor(state.lon + dLon + 180);
  if (lonHi - lonLo >= 359) { lonLo = 0; lonHi = 359; }
  for (let la = latLo; la <= latHi; la++) {
    for (let lo = lonLo; lo <= lonHi; lo++) {
      const bucket = grid.get(cellKey(la, lo));
      if (!bucket) continue;
      for (const s of bucket) {
        const d = haversineKm(state.lat, state.lon, s.lat, s.lon);
        if (d <= radiusKm) out.push({ s, d });
      }
    }
  }
  return out;
}

// nearest station that isn't known to be dead
function nearestStation() {
  for (const r of [25, 100, 400, 1500, 5000]) {
    let best = null;
    for (const c of stationsWithin(r)) {
      if (!deadStationUrls.has(c.s.url) && (!best || c.d < best.d)) best = c;
    }
    if (best) return { station: best.s, dist: best.d };
  }
  let best = null;  // middle of an ocean: fall back to a full scan
  for (const s of stations) {
    if (deadStationUrls.has(s.url)) continue;
    const d = haversineKm(state.lat, state.lon, s.lat, s.lon);
    if (!best || d < best.dist) best = { station: s, dist: d };
  }
  return best;
}

// ====================================================================
//  AUDIO
// ====================================================================
const player = $("player");
const skipBtn = $("skipBtn");
let loadId = 0;             // bumps on every station change; stale callbacks compare against it
let startTimer = null;
let needsGesture = false;   // browser blocked autoplay; wait for a click / key press

function armStartTimer(id) {
  clearTimeout(startTimer);
  startTimer = setTimeout(() => {
    if (id === loadId && !needsGesture) markStationDead("Station isn't responding");
  }, STREAM_START_TIMEOUT_MS);
}

function tryPlay(id) {
  player.play().catch((err) => {
    if (id !== loadId) return;                 // a newer station replaced this one
    if (err.name === "NotAllowedError") {
      needsGesture = true;
      clearTimeout(startTimer);
      setNPStatus("Click or press any key to start the audio");
    } else if (err.name !== "AbortError") {
      markStationDead("Stream wouldn't start");
    }
  });
}

function playStation(s, dist) {
  const prev = currentStation;
  currentStation = s;
  const id = ++loadId;
  player.src = s.url;
  armStartTimer(id);
  tryPlay(id);
  updateNowPlaying(s, dist);
  setStationFeatureState(prev, { current: false });
  setStationFeatureState(s, { current: true });
}

function resumeAudioFromGesture() {
  if (!needsGesture || !currentStation) return;
  needsGesture = false;
  setNPStatus("Tuning in…");
  armStartTimer(loadId);
  tryPlay(loadId);
}
window.addEventListener("pointerdown", resumeAudioFromGesture);
window.addEventListener("keydown", resumeAudioFromGesture);

function markStationDead(reason) {
  if (!currentStation) return;
  clearTimeout(startTimer);
  deadStationUrls.add(currentStation.url);
  setStationFeatureState(currentStation, { dead: true });
  // stop a late-loading stream from suddenly starting after we gave up on it
  player.removeAttribute("src");
  player.load();
  setNPStatus(reason + " — skip to the next station.");
  $("npTitle").classList.add("dead");
  $("nowPlaying").classList.add("isDead");
  skipBtn.hidden = false;
}

function skipToNextStation() {
  const near = nearestStation();   // excludes the dead station we're on
  if (near) playStation(near.station, near.dist);
}
skipBtn.onclick = skipToNextStation;

player.addEventListener("playing", () => {
  clearTimeout(startTimer);
  if (currentStation && !deadStationUrls.has(currentStation.url)) setNPStatus("");
});
player.addEventListener("error", () => {
  // ignore errors from a src we've already moved away from
  if (currentStation && player.getAttribute("src") === currentStation.url) {
    markStationDead("Stream failed");
  }
});
player.addEventListener("ended", () => {
  if (currentStation && player.getAttribute("src") === currentStation.url) {
    markStationDead("Stream ended");
  }
});

$("muteBtn").onclick = () => {
  player.muted = !player.muted;   // keeps the stream live instead of pausing it
  $("muteBtn").textContent = player.muted ? "🔇 Unmute" : "🔊 Mute";
};

// ====================================================================
//  NOW-PLAYING CARD
// ====================================================================
function setNPStatus(txt) {
  $("npStatus").textContent = txt;
}

function formatDist(d) {
  return (d < 10 ? d.toFixed(1) : Math.round(d).toLocaleString()) + " km away";
}

function updateNowPlaying(s, dist) {
  const loc = [s.state, s.country].filter(Boolean).join(", ") || "Location unknown";
  $("npName").textContent = s.name;
  $("npName").title = s.name;
  $("npLoc").textContent = loc;
  $("npGenre").textContent = s.tags ? s.tags.split(",").slice(0, 3).join(", ") : "—";
  $("npStream").textContent = s.bitrate ? `${s.codec} ${s.bitrate}kbps` : (s.codec || "—");
  $("npDist").textContent = formatDist(dist);
  $("npTitle").classList.remove("dead");
  $("nowPlaying").classList.remove("isDead");
  skipBtn.hidden = true;
  setNPStatus(needsGesture ? "Click or press any key to start the audio" : "Tuning in…");
  $("nowPlaying").classList.add("show");

  if ("mediaSession" in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: loc, album: "Radio Flight" });
  }
}

// ====================================================================
//  PROXIMITY CHECK — local math, no network
// ====================================================================
function checkProximity() {
  const near = nearestStation();
  if (!near) return;
  if (!currentStation) {
    playStation(near.station, near.dist);
    return;
  }
  const curDist = haversineKm(state.lat, state.lon, currentStation.lat, currentStation.lon);
  // Require a clear margin so we don't flap between two stations at a boundary.
  // A dead station stays put until you skip it or fly nearer another one.
  if (near.station !== currentStation && near.dist < curDist - Math.max(1, curDist * 0.1)) {
    playStation(near.station, near.dist);
  } else {
    $("npDist").textContent = formatDist(curDist);
  }
}

// ====================================================================
//  MINIMAP
// ====================================================================
const mm = $("minimap");
const MM_SIZE = 190;
const MM_C = MM_SIZE / 2;
const dpr = window.devicePixelRatio || 1;
mm.width = MM_SIZE * dpr;
mm.height = MM_SIZE * dpr;
const mmCtx = mm.getContext("2d");
mmCtx.scale(dpr, dpr);

function drawMinimap() {
  mmCtx.clearRect(0, 0, MM_SIZE, MM_SIZE);
  mmCtx.save();
  mmCtx.beginPath();
  mmCtx.arc(MM_C, MM_C, MM_C, 0, Math.PI * 2);
  mmCtx.clip();

  // range rings + crosshair
  mmCtx.strokeStyle = "rgba(124,252,154,0.15)";
  mmCtx.lineWidth = 1;
  for (let r = 1; r <= 3; r++) {
    mmCtx.beginPath();
    mmCtx.arc(MM_C, MM_C, (MM_C - 6) * r / 3, 0, Math.PI * 2);
    mmCtx.stroke();
  }
  mmCtx.beginPath();
  mmCtx.moveTo(MM_C, 6); mmCtx.lineTo(MM_C, MM_SIZE - 6);
  mmCtx.moveTo(6, MM_C); mmCtx.lineTo(MM_SIZE - 6, MM_C);
  mmCtx.stroke();

  // station dots, rotated so the heading points up
  const cosH = Math.cos(state.heading);
  const sinH = Math.sin(state.heading);
  const kmPerDegLon = 111 * Math.cos(toRad(state.lat));
  const scale = (MM_C - 8) / MM_RADIUS_KM;
  let current = null;
  for (const { s } of stationsWithin(MM_RADIUS_KM)) {
    const east  = wrapLon(s.lon - state.lon) * kmPerDegLon;
    const north = (s.lat - state.lat) * 111;
    const right   = east * cosH - north * sinH;
    const forward = east * sinH + north * cosH;
    const px = MM_C + right * scale;
    const py = MM_C - forward * scale;
    if (currentStation && s === currentStation) { current = { px, py }; continue; }
    mmCtx.beginPath();
    mmCtx.arc(px, py, 2.5, 0, Math.PI * 2);
    mmCtx.fillStyle = deadStationUrls.has(s.url) ? "#ff5c5c" : "#7CFC9A";
    mmCtx.fill();
  }
  if (current) {  // drawn last so it sits on top
    const color = deadStationUrls.has(currentStation.url) ? "#ff5c5c" : "#e6fff0";
    mmCtx.beginPath();
    mmCtx.arc(current.px, current.py, 4, 0, Math.PI * 2);
    mmCtx.fillStyle = color;
    mmCtx.shadowColor = color;
    mmCtx.shadowBlur = 8;
    mmCtx.fill();
    mmCtx.shadowBlur = 0;
  }
  mmCtx.restore();

  // self: heading triangle at the centre
  mmCtx.fillStyle = "#c9d4dc";
  mmCtx.beginPath();
  mmCtx.moveTo(MM_C, MM_C - 7);
  mmCtx.lineTo(MM_C - 5, MM_C + 5);
  mmCtx.lineTo(MM_C + 5, MM_C + 5);
  mmCtx.closePath();
  mmCtx.fill();
}

// ====================================================================
//  MAP + FLIGHT LOOP
// ====================================================================
const STATION_COLOR = [
  "case",
  ["boolean", ["feature-state", "dead"], false], "#ff5c5c",
  ["boolean", ["feature-state", "current"], false], "#e6fff0",
  "#7CFC9A",
];

function stationPointsGeoJSON() {
  return {
    type: "FeatureCollection",
    features: stations.map((s) => ({
      type: "Feature", id: s.id, properties: {},
      geometry: { type: "Point", coordinates: [s.lon, s.lat] },
    })),
  };
}

// small hexagons extruded into light beams so stations stand out at a low angle
function stationBeamsGeoJSON() {
  const R = 35;  // metres
  return {
    type: "FeatureCollection",
    features: stations.map((s) => {
      const dLat = R / 111320;
      const dLon = R / (111320 * Math.max(0.05, Math.cos(toRad(s.lat))));
      const ring = [];
      for (let k = 0; k < 6; k++) {
        const a = k * Math.PI / 3;
        ring.push([s.lon + dLon * Math.cos(a), s.lat + dLat * Math.sin(a)]);
      }
      ring.push(ring[0]);
      return { type: "Feature", id: s.id, properties: {}, geometry: { type: "Polygon", coordinates: [ring] } };
    }),
  };
}

function setStationFeatureState(s, featureState) {
  if (!s || !mapReady) return;
  for (const source of ["stations", "beams"]) {
    map.setFeatureState({ source, id: s.id }, featureState);
  }
}

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    interactive: false,          // the flight controls drive the camera
    maxPitch: 85,
    attributionControl: false,
    center: [state.lon, state.lat],
    zoom: 14,
    style: {
      version: 8,
      sources: {
        imagery: {
          type: "raster", tiles: [IMAGERY_URL], tileSize: 256, maxzoom: 18,
          attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
        },
        stations: { type: "geojson", data: stationPointsGeoJSON() },
        beams: { type: "geojson", data: stationBeamsGeoJSON() },
      },
      sky: {
        "sky-color": "#5fa8e8",
        "horizon-color": "#d6e9f7",
        "fog-color": "#d6e9f7",
        "sky-horizon-blend": 0.5,
        "horizon-fog-blend": 0.5,
        "fog-ground-blend": 0.6,
      },
      layers: [
        { id: "imagery", type: "raster", source: "imagery" },
        {
          id: "beams", type: "fill-extrusion", source: "beams", minzoom: 9,
          paint: {
            "fill-extrusion-color": STATION_COLOR,
            "fill-extrusion-height": 500,
            "fill-extrusion-opacity": 0.45,
          },
        },
        {
          id: "stations", type: "circle", source: "stations",
          paint: {
            "circle-color": STATION_COLOR,
            "circle-radius": ["interpolate", ["linear"], ["zoom"], 4, 2, 10, 4, 15, 7],
            "circle-stroke-color": "#042713",
            "circle-stroke-width": 1,
            "circle-opacity": 0.9,
            "circle-pitch-alignment": "viewport",
            "circle-pitch-scale": "map",
          },
        },
      ],
    },
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "top-right");
  map.on("load", () => {
    mapReady = true;
    for (const url of deadStationUrls) {
      const s = stations.find((x) => x.url === url);
      setStationFeatureState(s, { dead: true });
    }
    setStationFeatureState(currentStation, { current: true });
  });
  map.on("error", (e) => console.warn("Map error:", e.error || e));
  updateCamera();
}

function updateCamera() {
  const cam = map.calculateCameraOptionsFromCameraLngLatAltRotation(
    [state.lon, state.lat], state.altitude, toDeg(state.heading), CAMERA_PITCH);
  // Pass fields explicitly: jumpTo throws on the undefined `roll` this helper returns.
  map.jumpTo({ center: cam.center, zoom: cam.zoom, bearing: cam.bearing, pitch: cam.pitch });
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);  // seconds, clamped
  lastT = now;

  state.heading += state.turn * TURN_RATE * dt;
  state.heading = ((state.heading % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

  const climbRate = 40 + state.altitude * 0.4;     // m/s, quicker when already high
  state.altitude += state.climb * climbRate * dt;
  state.altitude = Math.max(MIN_ALT, Math.min(state.altitude, MAX_ALT));

  const distM = state.speedKph / 3.6 * dt;
  state.lat += Math.cos(state.heading) * distM / 111320;
  state.lon += Math.sin(state.heading) * distM / (111320 * Math.max(0.01, Math.cos(toRad(state.lat))));
  state.lon = wrapLon(state.lon);
  state.lat = Math.max(-84, Math.min(84, state.lat));   // web-mercator limit

  updateCamera();
  drawMinimap();
  $("altReadout").textContent =
    "ALT " + Math.round(state.altitude).toLocaleString() + " m · HDG " +
    String(Math.round(toDeg(state.heading)) % 360).padStart(3, "0") + "°";

  requestAnimationFrame(frame);
}

// ====================================================================
//  INPUT
// ====================================================================
const KEY_ACTIONS = {
  w: "up", arrowup: "up", s: "down", arrowdown: "down",
  a: "left", arrowleft: "left", d: "right", arrowright: "right",
};
const heldKeys = new Set();

function syncControls() {
  state.climb = (heldKeys.has("up") ? 1 : 0) - (heldKeys.has("down") ? 1 : 0);
  state.turn = (heldKeys.has("right") ? 1 : 0) - (heldKeys.has("left") ? 1 : 0);
}

window.addEventListener("keydown", (e) => {
  if (!flying || (e.target.tagName === "INPUT" && e.target.type === "text")) return;
  const action = KEY_ACTIONS[e.key.toLowerCase()];
  if (!action) return;
  e.preventDefault();   // also stops arrow keys from nudging a focused slider
  heldKeys.add(action);
  syncControls();
});
window.addEventListener("keyup", (e) => {
  const action = KEY_ACTIONS[e.key.toLowerCase()];
  if (!action) return;
  heldKeys.delete(action);
  syncControls();
});
window.addEventListener("blur", () => { heldKeys.clear(); syncControls(); });

const slider = $("speedSlider");
slider.addEventListener("input", () => {
  state.speedKph = parseInt(slider.value, 10);
  $("speedVal").textContent = state.speedKph.toLocaleString();
});

// ====================================================================
//  START
// ====================================================================
function buildPresets() {
  const wrap = $("presets");
  PRESETS.forEach((p) => {
    const b = document.createElement("button");
    b.className = "preset";
    b.textContent = p.name;
    b.onclick = () => startFlight(p.lat, p.lon);
    wrap.appendChild(b);
  });
}

// simple geocode via OpenStreetMap Nominatim (typed location)
async function geocode(q) {
  try {
    const r = await fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q),
      { headers: { "Accept-Language": "en" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (d && d.length) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
  } catch (e) { console.error(e); }
  return null;
}

async function startFromTypedPlace() {
  const q = $("locInput").value.trim();
  if (!q) return false;
  const status = $("loadStatus");
  status.textContent = "Finding " + q + "…";
  const g = await geocode(q);
  if (g) startFlight(g.lat, g.lon);
  else status.textContent = "Couldn't find that place — try another or pick a preset.";
  return true;
}

$("locInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") startFromTypedPlace();
});

$("goBtn").onclick = async () => {
  if (!(await startFromTypedPlace())) startFlight(PRESETS[0].lat, PRESETS[0].lon);
};

function startFlight(lat, lon) {
  if (flying) return;
  if (!window.maplibregl) {
    $("loadStatus").textContent = "The map library didn't load. Check your connection and reload.";
    return;
  }
  if (!stations.length) {
    pendingStart = { lat, lon };
    $("loadStatus").textContent = "Still loading stations — you'll take off as soon as they're ready.";
    return;
  }
  pendingStart = null;
  flying = true;
  state.lat = lat;
  state.lon = lon;
  state.altitude = 200;
  state.heading = 0;
  state.speedKph = parseInt(slider.value, 10);

  $("startup").style.display = "none";
  initMap();

  // Pick the first station right away so playback starts inside the click
  // (browsers only allow autoplay with sound during a user gesture).
  checkProximity();
  setInterval(checkProximity, PROXIMITY_MS);

  lastT = performance.now();
  requestAnimationFrame(frame);
}

// ---------- boot ----------
buildPresets();
loadStations();
</script>
</body>
</html>
